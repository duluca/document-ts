name: CI
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy:
    name: CI policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: node:current
    steps:
      - uses: actions/checkout@v7
      - run: |
          echo 'node:22.23.2-bookworm@sha256:8a34c4ab3ea2c5cd194f07e317b2a8f09461d3c8b05c4e34c8ccd56d56024c4d'
          echo 'npm ci --ignore-scripts'
          echo 'npm run verify:test-image'
  build:
    name: Build, test, coverage, and package
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: node:current
    services:
      mongodb:
        image: mongo:latest
    steps:
      - uses: docker://mongo:latest
